version: "3.9"

services:
  zhyva-apteka-bot:
    build: .
    container_name: zhyva-apteka
    restart: unless-stopped
    env_file: .env
    volumes:
      # Персистентне зберігання ChromaDB та книг
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/books:/app/data/books
      - ./data/processed:/app/data/processed
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Окремий сервіс для одноразового завантаження даних у базу
  # Запустіть: docker-compose run --rm ingest
  ingest:
    build: .
    container_name: zhyva-apteka-ingest
    env_file: .env
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/books:/app/data/books
      - ./data/processed:/app/data/processed
    command: ["python", "scripts/ingest.py"]
    profiles:
      - tools

  # Монітор згадувань «Реноватор»: лише стандартна бібліотека Python, окремий легкий образ.
  # Запуск: docker-compose up -d renovator-monitor
  renovator-monitor:
    image: python:3.12-slim
    container_name: renovator-monitor
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    volumes:
      - ./renovator_monitor:/app/renovator_monitor:ro
      - ./data/renovator:/app/data/renovator
    command: ["python", "-m", "renovator_monitor", "watch", "--interval", "3600"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
